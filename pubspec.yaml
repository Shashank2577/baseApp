name: base_workspace
description: Monorepo root for the base platform. Not an app.
publish_to: none

environment:
  sdk: ^3.13.7

# Every package and app is a workspace member, so one `flutter pub get` at the
# root resolves them all against one lockfile, and a change in a package is
# picked up by every app immediately. `./base new` adds new apps here.
workspace:
  - packages/base_design
  - packages/base_models
  - packages/base_ai
  - packages/base_ai_native
  - packages/base_core
  - tools/base_tool
  - apps/starter
