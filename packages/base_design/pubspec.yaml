name: base_design
description: The hand-drawn minimal design system (tokens, handwriting voices, doodles, components) shared by every app.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Bundled so the look works offline. All SIL Open Font License (texts in fonts/).
  # Apps use them through TextStyle(package: 'base_design'), which the theme does for you.
  fonts:
    - family: Caveat
      fonts:
        - asset: fonts/caveat_regular.ttf
        - asset: fonts/caveat_semibold.ttf
          weight: 600
        - asset: fonts/caveat_bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: fonts/inter_regular.ttf
        - asset: fonts/inter_medium.ttf
          weight: 500
        - asset: fonts/inter_semibold.ttf
          weight: 600
    - family: Nunito
      fonts:
        - asset: fonts/nunito_regular.ttf
        - asset: fonts/nunito_semibold.ttf
          weight: 600
    - family: ShantellSans
      fonts:
        - asset: fonts/shantell_variable.ttf
    - family: PatrickHand
      fonts:
        - asset: fonts/patrickhand_regular.ttf
